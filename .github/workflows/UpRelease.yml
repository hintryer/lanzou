name: Download & Upload to Release

on:
  workflow_dispatch:

jobs:
  download-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install jq
        run: sudo apt install -y jq

      - name: Extract URLs from JSON
        run: |
          jq -r '.[] | .url' ./setting/result.json > download.txt

      # ==============================================
      # ✅ 看得见每个文件的下载情况：成功 / 失败
      # ==============================================
      - name: Download with log
        run: |
          while read url; do
            if [ -n "$url" ]; then
              filename=$(basename "$url" | sed 's/%2B/+/g')
              echo "========================================"
              echo "  下载中：$filename"
              echo "  地址：$url"
              
              curl -L -A "Chrome/130.0.0.0" "$url" -o "$filename" -f -s
              
              if [ $? -eq 0 ]; then
                echo "  ✅ 下载成功：$filename"
              else
                echo "  ❌ 下载失败：$filename"
              fi
              echo "========================================"
              echo
            fi
          done < download.txt

      # ==============================================
      # ✅ 干净上传：只上传下载成功的文件
      # ==============================================
      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y%02d%02d)"
          gh release create "$TAG" --title "$TAG" --notes "自动构建" || true
          
          find . -maxdepth 1 -type f \
            ! -name "*.txt" ! -name "*.json" ! -name "*.md" ! -name "*.yml" ! -name "*.yaml" \
            | xargs -I {} gh release upload "$TAG" "{}" --clobber
