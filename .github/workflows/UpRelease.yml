name: Download & Upload to Release

on:
  workflow_dispatch:

jobs:
  download-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt install -y jq

      - name: Extract URLs from JSON
        run: |
          jq -r '.[] | .url' ./setting/result.json > download.txt

      # ✅ 最稳方案：curl 下载，失败也不中断脚本
      - name: Download all files (safe mode)
        run: |
          while read url; do
            if [ -n "$url" ]; then
              curl -L -f -A "Chrome/130.0.0.0" -O "$url" || true
            fi
          done < download.txt

      # ✅ 只上传下载成功的文件（不上传json/txt，干净）
      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y%m%d)"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Auto downloaded" \
            --latest || true
            
          gh release upload "$TAG" ./*.* --clobber