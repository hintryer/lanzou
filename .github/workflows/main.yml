name: main
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # 每日UTC6点（北京时间14点）执行

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 配置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt

      - name: 执行更新脚本
        run: |
          python lan.py

      - name: 提交更新文件（普通推送）
        run: |
          git config --global user.name "更新机器人"
          git config --global user.email "software-bot@github.com"

          find software/ -type f -size +100M -print0 | xargs -0 rm -f
          echo "✅ 已清理超过100MB的文件"
          
          git add .
          git commit -a -m "Update $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push